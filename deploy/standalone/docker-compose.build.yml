# Docker Compose for Cosmos Video Dataset Search - Local Build Version
# This version builds images locally using Dockerfiles instead of pulling from NGC

services:
  # ================================================
  # Environment Validation (MOVED TO TOP)
  # ================================================

  validate-env:
    image: bash
    pull_policy: always
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ${HOME}/.docker:/root/.docker:ro
      - type: bind
        source: ${DATA_DIR}
        target: /validation/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COSMOS_EMBED_MODEL_HOST_PATH:-${HOME}/.cache/cosmos-embed1}
        target: /validation/cosmos-embed-model
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: ce1-oss-hf-cache
        target: /validation/huggingface
        read_only: true
    entrypoint: ["/usr/local/bin/bash"]
    command: ["/workspace/scripts/validate_env.sh"]
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DATA_DIR=${DATA_DIR:-}
      - DATA_DIR_VALIDATION_PATH=/validation/data
      - AWS_ACCESS_KEY_ID=${VAST_ACCESS_KEY:-${AWS_ACCESS_KEY_ID:-}}
      - AWS_SECRET_ACCESS_KEY=${VAST_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY:-}}
      - AWS_ENDPOINT_URL=${VAST_S3_ENDPOINT:-${AWS_ENDPOINT_URL:-}}
      - GUNICORN_PORT=${GUNICORN_PORT:-8888}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-600}
      - MAX_DOCS_PER_UPLOAD=${MAX_DOCS_PER_UPLOAD:-1000}
      - COSMOS_EMBED_SERVICE_MODE=${COSMOS_EMBED_SERVICE_MODE:-oss}
      - COSMOS_EMBED_GPUS=${COSMOS_EMBED_GPUS:-1}
      - COSMOS_EMBED_BACKEND=${COSMOS_EMBED_BACKEND:-pytorch}
      - COSMOS_EMBED_MODEL_PATH=${COSMOS_EMBED_MODEL_PATH:-/models/cosmos-embed1}
      - COSMOS_EMBED_WEIGHTS_DIR=${COSMOS_EMBED_WEIGHTS_DIR:-}
      - COSMOS_EMBED_MODEL_VARIANT=${COSMOS_EMBED_MODEL_VARIANT:-224p}
      - COSMOS_EMBED_ALLOW_HF_DOWNLOAD=${COSMOS_EMBED_ALLOW_HF_DOWNLOAD:-false}
      - COSMOS_EMBED_HF_MODEL_ID=${COSMOS_EMBED_HF_MODEL_ID:-nvidia/Cosmos-Embed1-224p}
      - COSMOS_EMBED_HF_REVISION=${COSMOS_EMBED_HF_REVISION:-787e0b996f5260a71ad474a283c90539a2e12986}
      - COSMOS_EMBED_LOCAL_FILES_ONLY=${COSMOS_EMBED_LOCAL_FILES_ONLY:-true}
      - COSMOS_EMBED_MAX_MEDIA_BYTES=${COSMOS_EMBED_MAX_MEDIA_BYTES:-100663296}
      - COSMOS_EMBED_MODEL_HOST_PATH=${COSMOS_EMBED_MODEL_HOST_PATH:-${HOME}/.cache/cosmos-embed1}
      - COSMOS_EMBED_MODEL_VALIDATION_PATH=/validation/cosmos-embed-model
      - COSMOS_EMBED_HF_CACHE_VALIDATION_PATH=/validation/huggingface
      - HF_HOME=${HF_HOME:-}
      - HF_HUB_CACHE=${HF_HUB_CACHE:-}
      - HUGGINGFACE_HUB_CACHE=${HUGGINGFACE_HUB_CACHE:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
            - COSMOS_EMBED_URI=${COSMOS_EMBED_URI:-http://cosmos-embed:8000}
      - VISUAL_SEARCH_LOG_LEVEL=${VISUAL_SEARCH_LOG_LEVEL:-DEBUG}
      - ALLOWED_PIPELINES=${ALLOWED_PIPELINES:-cosmos_video_search_vastdb}

  # ================================================
  # Infrastructure Services
  # ================================================
  cosmos-embed-cache-init:
    image: ${COSMOS_EMBED_IMAGE:-cvds-cosmos-embed-oss-pytorch:local}
    user: root
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      [
        "chown",
        "-R",
        "appuser:appuser",
        "/home/appuser/.cache/huggingface",
      ]
    volumes:
      - type: volume
        source: ce1-oss-hf-cache
        target: /home/appuser/.cache/huggingface

  cosmos-embed:
    image: ${COSMOS_EMBED_IMAGE:-cvds-cosmos-embed-oss-pytorch:local}
    container_name: cosmos-embed
    runtime: nvidia
    # ── expose one GPU in dev; in CI you can stub with 0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${COSMOS_EMBED_GPUS:-1}
              capabilities: [gpu]
    shm_size: 16g
    tmpfs:
      - /tmp/ram:rw,size=2g,uid=999,gid=999,mode=1770
    ports:
      - "9000:8000"
    volumes:
      - type: bind
        source: ${COSMOS_EMBED_MODEL_HOST_PATH:-${HOME}/.cache/cosmos-embed1}
        target: /models/cosmos-embed1
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: ce1-oss-hf-cache
        target: /home/appuser/.cache/huggingface
    environment:
      - NGC_API_KEY=${COSMOS_EMBED_NGC_API_KEY:-${NVIDIA_API_KEY:-}}
      - COSMOS_EMBED_BACKEND=${COSMOS_EMBED_BACKEND:-pytorch}
      - COSMOS_EMBED_GPU_FRAMES=${COSMOS_EMBED_GPU_FRAMES:-true}
      - COSMOS_EMBED_GPU_VIDEO=${COSMOS_EMBED_GPU_VIDEO:-true}
      - COSMOS_EMBED_MODEL_PATH=${COSMOS_EMBED_MODEL_PATH:-/models/cosmos-embed1}
      - COSMOS_EMBED_WEIGHTS_DIR=${COSMOS_EMBED_WEIGHTS_DIR:-}
      - COSMOS_EMBED_MODEL_VARIANT=${COSMOS_EMBED_MODEL_VARIANT:-224p}
      - COSMOS_EMBED_PREPARATION_WORKERS=${COSMOS_EMBED_PREPARATION_WORKERS:-8}
      - COSMOS_EMBED_SDPA=${COSMOS_EMBED_SDPA:-true}
      - COSMOS_EMBED_TORCH_COMPILE=${COSMOS_EMBED_TORCH_COMPILE:-true}
      - COSMOS_EMBED_ALLOW_HF_DOWNLOAD=${COSMOS_EMBED_ALLOW_HF_DOWNLOAD:-false}
      - COSMOS_EMBED_HF_MODEL_ID=${COSMOS_EMBED_HF_MODEL_ID:-nvidia/Cosmos-Embed1-224p}
      - COSMOS_EMBED_HF_REVISION=${COSMOS_EMBED_HF_REVISION:-787e0b996f5260a71ad474a283c90539a2e12986}
      - COSMOS_EMBED_LOCAL_FILES_ONLY=${COSMOS_EMBED_LOCAL_FILES_ONLY:-true}
      - COSMOS_EMBED_MAX_MEDIA_BYTES=${COSMOS_EMBED_MAX_MEDIA_BYTES:-100663296}
      - COSMOS_EMBED_TMP_DIR=${COSMOS_EMBED_TMP_DIR:-/tmp/ram}
      - COSMOS_EMBED_MEDIA_DOWNLOAD_TIMEOUT_SECONDS=${COSMOS_EMBED_MEDIA_DOWNLOAD_TIMEOUT_SECONDS:-300}
      - COSMOS_EMBED_PRESIGNED_URL_ENDPOINT_URL=${COSMOS_EMBED_PRESIGNED_URL_ENDPOINT_URL:-${VAST_S3_ENDPOINT}}
      - COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HOSTS=${COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HOSTS:-}
      - COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HTTP_ORIGINS=${COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HTTP_ORIGINS:-}
      - COSMOS_EMBED_SERVICE_VERSION=${COSMOS_EMBED_SERVICE_VERSION:-1.2.0}
      - HF_HOME=${HF_HOME:-/home/appuser/.cache/huggingface}
      - HF_HUB_CACHE=${HF_HUB_CACHE:-}
      - HUGGINGFACE_HUB_CACHE=${HUGGINGFACE_HUB_CACHE:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready', timeout=5).read()\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
    networks:
      - cvds
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      validate-env:
        condition: service_completed_successfully
      cosmos-embed-cache-init:
        condition: service_completed_successfully

  # ================================================
  # Core Services (Built locally)
  # ================================================

  visual-search:
    image: ${VISUAL_SEARCH_IMAGE:-visual-search:local}
    build:
      context: ../..
      dockerfile: docker/services/visual-search.Dockerfile
    container_name: visual-search
    environment:
      GUNICORN_PORT: ${GUNICORN_PORT:-8888}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-600}
      MAX_DOCS_PER_UPLOAD: ${MAX_DOCS_PER_UPLOAD:-100}
      COSMOS_EMBED_URI: ${COSMOS_EMBED_URI:-http://cosmos-embed:8000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ALLOWED_PIPELINES: ${ALLOWED_PIPELINES:-cosmos_video_search_vastdb}
      VISUAL_SEARCH_LOG_LEVEL: ${VISUAL_SEARCH_LOG_LEVEL:-DEBUG}
      # VastDB vector store
      VASTDB_ENDPOINT: ${VASTDB_ENDPOINT}
      VAST_ACCESS_KEY: ${VAST_ACCESS_KEY:-${AWS_ACCESS_KEY_ID}}
      VAST_SECRET_KEY: ${VAST_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY}}
      VASTDB_BUCKET: ${VASTDB_BUCKET:-cds-vastdb}
      VASTDB_SCHEMA: ${VASTDB_SCHEMA:-cds}
      VASTDB_EMBEDDING_DIM: ${VASTDB_EMBEDDING_DIM:-256}
      VASTDB_SSL_VERIFY: ${VASTDB_SSL_VERIFY:-false}
      VAST_ADBC_DRIVER_PATH: ${VAST_ADBC_DRIVER_PATH:-/opt/adbc-driver/libadbc_driver_vastdb.so}
      # Vast S3 for media
      VAST_S3_ENDPOINT: ${VAST_S3_ENDPOINT:-${AWS_ENDPOINT_URL}}
      AWS_ACCESS_KEY_ID: ${VAST_S3_ACCESS_KEY:-${VAST_ACCESS_KEY:-${AWS_ACCESS_KEY_ID}}}
      AWS_SECRET_ACCESS_KEY: ${VAST_S3_SECRET_KEY:-${VAST_SECRET_KEY:-${AWS_SECRET_ACCESS_KEY}}}
      AWS_DEFAULT_REGION: ${VAST_S3_REGION:-${AWS_DEFAULT_REGION:-us-east-1}}
      AWS_ENDPOINT_URL: ${VAST_S3_ENDPOINT:-${AWS_ENDPOINT_URL}}
      CDS_FETCH_ALLOWED_ORIGINS: ${CDS_FETCH_ALLOWED_ORIGINS:-}
      CDS_FETCH_PRIVATE_ORIGINS: ${CDS_FETCH_PRIVATE_ORIGINS:-${VAST_S3_ENDPOINT}}
      CDS_FETCH_S3_ENDPOINTS: ${CDS_FETCH_S3_ENDPOINTS:-${VAST_S3_ENDPOINT}}
      CDS_FETCH_MAX_TEXT_BYTES: ${CDS_FETCH_MAX_TEXT_BYTES:-16777216}
    ports:
      - "8888:8888"
    volumes:
      - ../../src/visual_search:/app/src/visual_search
      - ../../src/haystack:/app/src/haystack
      - ../../models:/app/models
      - ${VAST_ADBC_DRIVER_HOST_PATH:-/opt/adbc-driver}:/opt/adbc-driver:ro
    depends_on:
      cosmos-embed:
        condition: service_healthy
    networks:
      - cvds

# ================================================
# Volumes
# ================================================

volumes:
  ce1-oss-hf-cache:

# ================================================
# Networks
# ================================================

networks:
  cvds:
    driver: bridge
