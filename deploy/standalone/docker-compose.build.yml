# Docker Compose for Cosmos Video Dataset Search - Local Build Version
# This version builds images locally using Dockerfiles instead of pulling from NGC

services:
  # ================================================
  # Environment Validation (MOVED TO TOP)
  # ================================================

  validate-env:
    image: bash
    pull_policy: always
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ${HOME}/.docker:/root/.docker:ro
      - type: bind
        source: ${DATA_DIR}
        target: /validation/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${COSMOS_EMBED_MODEL_HOST_PATH:-${HOME}/.cache/cosmos-embed1}
        target: /validation/cosmos-embed-model
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: ce1-oss-hf-cache
        target: /validation/huggingface
        read_only: true
    entrypoint: ["/usr/local/bin/bash"]
    command: ["/workspace/scripts/validate_env.sh"]
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DATA_DIR=${DATA_DIR:-}
      - DATA_DIR_VALIDATION_PATH=/validation/data
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-test}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-test}
      - AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL:-http://localstack:4566}
      - GUNICORN_PORT=${GUNICORN_PORT:-8888}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-2}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-600}
      - MAX_DOCS_PER_UPLOAD=${MAX_DOCS_PER_UPLOAD:-1000}
      - COSMOS_EMBED_SERVICE_MODE=${COSMOS_EMBED_SERVICE_MODE:-oss}
      - COSMOS_EMBED_GPUS=${COSMOS_EMBED_GPUS:-1}
      - COSMOS_EMBED_BACKEND=${COSMOS_EMBED_BACKEND:-pytorch}
      - COSMOS_EMBED_MODEL_PATH=${COSMOS_EMBED_MODEL_PATH:-/models/cosmos-embed1}
      - COSMOS_EMBED_WEIGHTS_DIR=${COSMOS_EMBED_WEIGHTS_DIR:-}
      - COSMOS_EMBED_MODEL_VARIANT=${COSMOS_EMBED_MODEL_VARIANT:-224p}
      - COSMOS_EMBED_ALLOW_HF_DOWNLOAD=${COSMOS_EMBED_ALLOW_HF_DOWNLOAD:-false}
      - COSMOS_EMBED_HF_MODEL_ID=${COSMOS_EMBED_HF_MODEL_ID:-nvidia/Cosmos-Embed1-224p}
      - COSMOS_EMBED_HF_REVISION=${COSMOS_EMBED_HF_REVISION:-787e0b996f5260a71ad474a283c90539a2e12986}
      - COSMOS_EMBED_LOCAL_FILES_ONLY=${COSMOS_EMBED_LOCAL_FILES_ONLY:-true}
      - COSMOS_EMBED_MAX_MEDIA_BYTES=${COSMOS_EMBED_MAX_MEDIA_BYTES:-100663296}
      - COSMOS_EMBED_MODEL_HOST_PATH=${COSMOS_EMBED_MODEL_HOST_PATH:-${HOME}/.cache/cosmos-embed1}
      - COSMOS_EMBED_MODEL_VALIDATION_PATH=/validation/cosmos-embed-model
      - COSMOS_EMBED_HF_CACHE_VALIDATION_PATH=/validation/huggingface
      - HF_HOME=${HF_HOME:-}
      - HF_HUB_CACHE=${HF_HUB_CACHE:-}
      - HUGGINGFACE_HUB_CACHE=${HUGGINGFACE_HUB_CACHE:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - MILVUS_CUDA_VISIBLE_DEVICES=${MILVUS_CUDA_VISIBLE_DEVICES:-0}
      - COSMOS_EMBED_URI=${COSMOS_EMBED_URI:-http://cosmos-embed:8000}
      - VISUAL_SEARCH_LOG_LEVEL=${VISUAL_SEARCH_LOG_LEVEL:-DEBUG}
      - ALLOWED_PIPELINES=${ALLOWED_PIPELINES:-cosmos_video_search_milvus}

  # ================================================
  # Infrastructure Services
  # ================================================
  etcd:
    container_name: milvus-etcd
    image: quay.io/coreos/etcd:v3.5.5
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-test}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-test}
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - cvds
    depends_on:
      validate-env:
        condition: service_completed_successfully

  milvus:
    container_name: milvus
    image: milvusdb/milvus:v2.4.4-gpu
    command: ["milvus", "run", "standalone"]
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    security_opt:
    - seccomp:unconfined
    environment:
      - ETCD_ENDPOINTS=etcd:2379
      - MINIO_ACCESS_KEY_ID=${MINIO_ACCESS_KEY_ID:-test}
      - MINIO_SECRET_ACCESS_KEY=${MINIO_SECRET_ACCESS_KEY:-test}
      # GPU Memory Management for CAGRA
      - CUDA_VISIBLE_DEVICES=${MILVUS_CUDA_VISIBLE_DEVICES:-0}
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus_localstack.yaml:/milvus/configs/milvus.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      etcd:
        condition: service_healthy
      localstack:
        condition: service_healthy
      # Ensure cosmos-embed starts first to claim GPU memory before Milvus
      # This prevents GPU memory allocation race conditions that cause
      cosmos-embed:
        condition: service_healthy
    networks:
      - cvds

  cosmos-embed-cache-init:
    image: ${COSMOS_EMBED_IMAGE:-cvds-cosmos-embed-oss-pytorch:local}
    user: root
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    network_mode: none
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      [
        "chown",
        "-R",
        "appuser:appuser",
        "/home/appuser/.cache/huggingface",
      ]
    volumes:
      - type: volume
        source: ce1-oss-hf-cache
        target: /home/appuser/.cache/huggingface

  cosmos-embed:
    image: ${COSMOS_EMBED_IMAGE:-cvds-cosmos-embed-oss-pytorch:local}
    container_name: cosmos-embed
    runtime: nvidia
    # ── expose one GPU in dev; in CI you can stub with 0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${COSMOS_EMBED_GPUS:-1}
              capabilities: [gpu]
    shm_size: 16g
    tmpfs:
      - /tmp/ram:rw,size=2g,uid=999,gid=999,mode=1770
    ports:
      - "9000:8000"
    volumes:
      - type: bind
        source: ${COSMOS_EMBED_MODEL_HOST_PATH:-${HOME}/.cache/cosmos-embed1}
        target: /models/cosmos-embed1
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: ce1-oss-hf-cache
        target: /home/appuser/.cache/huggingface
    environment:
      - NGC_API_KEY=${COSMOS_EMBED_NGC_API_KEY:-${NVIDIA_API_KEY:-}}
      - COSMOS_EMBED_BACKEND=${COSMOS_EMBED_BACKEND:-pytorch}
      - COSMOS_EMBED_GPU_FRAMES=${COSMOS_EMBED_GPU_FRAMES:-true}
      - COSMOS_EMBED_GPU_VIDEO=${COSMOS_EMBED_GPU_VIDEO:-true}
      - COSMOS_EMBED_MODEL_PATH=${COSMOS_EMBED_MODEL_PATH:-/models/cosmos-embed1}
      - COSMOS_EMBED_WEIGHTS_DIR=${COSMOS_EMBED_WEIGHTS_DIR:-}
      - COSMOS_EMBED_MODEL_VARIANT=${COSMOS_EMBED_MODEL_VARIANT:-224p}
      - COSMOS_EMBED_PREPARATION_WORKERS=${COSMOS_EMBED_PREPARATION_WORKERS:-8}
      - COSMOS_EMBED_SDPA=${COSMOS_EMBED_SDPA:-true}
      - COSMOS_EMBED_TORCH_COMPILE=${COSMOS_EMBED_TORCH_COMPILE:-true}
      - COSMOS_EMBED_ALLOW_HF_DOWNLOAD=${COSMOS_EMBED_ALLOW_HF_DOWNLOAD:-false}
      - COSMOS_EMBED_HF_MODEL_ID=${COSMOS_EMBED_HF_MODEL_ID:-nvidia/Cosmos-Embed1-224p}
      - COSMOS_EMBED_HF_REVISION=${COSMOS_EMBED_HF_REVISION:-787e0b996f5260a71ad474a283c90539a2e12986}
      - COSMOS_EMBED_LOCAL_FILES_ONLY=${COSMOS_EMBED_LOCAL_FILES_ONLY:-true}
      - COSMOS_EMBED_MAX_MEDIA_BYTES=${COSMOS_EMBED_MAX_MEDIA_BYTES:-100663296}
      - COSMOS_EMBED_TMP_DIR=${COSMOS_EMBED_TMP_DIR:-/tmp/ram}
      - COSMOS_EMBED_MEDIA_DOWNLOAD_TIMEOUT_SECONDS=${COSMOS_EMBED_MEDIA_DOWNLOAD_TIMEOUT_SECONDS:-300}
      - COSMOS_EMBED_PRESIGNED_URL_ENDPOINT_URL=${COSMOS_EMBED_PRESIGNED_URL_ENDPOINT_URL:-http://localstack:4566}
      - COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HOSTS=${COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HOSTS:-}
      - COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HTTP_ORIGINS=${COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HTTP_ORIGINS:-}
      - COSMOS_EMBED_SERVICE_VERSION=${COSMOS_EMBED_SERVICE_VERSION:-1.2.0}
      - HF_HOME=${HF_HOME:-/home/appuser/.cache/huggingface}
      - HF_HUB_CACHE=${HF_HUB_CACHE:-}
      - HUGGINGFACE_HUB_CACHE=${HUGGINGFACE_HUB_CACHE:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health/ready', timeout=5).read()\" || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 6
    networks:
      - cvds
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      validate-env:
        condition: service_completed_successfully
      cosmos-embed-cache-init:
        condition: service_completed_successfully

  # ================================================
  # Core Services (Built locally)
  # ================================================

  visual-search:
    image: ${VISUAL_SEARCH_IMAGE:-visual-search:local}
    build:
      context: ../..
      dockerfile: docker/services/visual-search.Dockerfile
    container_name: visual-search
    environment:
      GUNICORN_PORT: ${GUNICORN_PORT:-8888}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-600}
      MAX_DOCS_PER_UPLOAD: ${MAX_DOCS_PER_UPLOAD:-100}
      MILVUS_DOCUMENT_STORE_URI: ${MILVUS_DOCUMENT_STORE_URI:-http://milvus:19530}
      MILVUS_DB: ${MILVUS_DB:-}
      COSMOS_EMBED_URI: ${COSMOS_EMBED_URI:-http://cosmos-embed:8000}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      ALLOWED_PIPELINES: ${ALLOWED_PIPELINES:-cosmos_video_search_milvus}
      VISUAL_SEARCH_LOG_LEVEL: ${VISUAL_SEARCH_LOG_LEVEL:-DEBUG}
      # LocalStack S3 configuration for bulk indexing
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:-http://localstack:4566}
      # Outbound text/Parquet import policy, configured by the operator only.
      CDS_FETCH_ALLOWED_ORIGINS: ${CDS_FETCH_ALLOWED_ORIGINS:-}
      CDS_FETCH_PRIVATE_ORIGINS: ${CDS_FETCH_PRIVATE_ORIGINS:-http://localstack:4566}
      CDS_FETCH_S3_ENDPOINTS: ${CDS_FETCH_S3_ENDPOINTS:-http://localstack:4566}
      CDS_FETCH_MAX_TEXT_BYTES: ${CDS_FETCH_MAX_TEXT_BYTES:-16777216}
      # Map localhost:4566 to localstack:4566 for Docker networking
      LOCALSTACK_HOSTNAME: localstack
    ports:
      - "8888:8888"
    volumes:
      - ../../src/visual_search:/app/src/visual_search
      - ../../src/haystack:/app/src/haystack
      - ../../models:/app/models
    depends_on:
      milvus:
        condition: service_healthy
      cosmos-embed:
        condition: service_healthy
    networks:
      - cvds

  localstack:
    image: localstack/localstack:4.7
    container_name: localstack
    ports:
      - "4566:4566"
    volumes:
      - "${DATA_DIR}/:/data:ro"
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    networks:
      - cvds
    environment:
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_ENDPOINT_URL=http://localstack:4566
      - EXTRA_CORS_ALLOWED_HEADERS=content-type,x-amz-date,authorization,x-api-key,x-amz-security-token,x-amz-user-agent
      - BUCKET_NAME=cosmos-test-bucket
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls >/dev/null 2>&1 || aws --endpoint-url=http://localhost:4566 s3 ls >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    depends_on:
      validate-env:
        condition: service_completed_successfully

# ================================================
# Volumes
# ================================================

volumes:
  milvus_data:
  etcd_data:
  ce1-oss-hf-cache:

# ================================================
# Networks
# ================================================

networks:
  cvds:
    driver: bridge
