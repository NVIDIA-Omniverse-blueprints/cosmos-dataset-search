# Add this file after docker-compose.ce1-oss.yml for explicit Hugging Face
# loading. The named volume replaces the offline host bind at the same target,
# and the empty model path lets the backend resolve COSMOS_EMBED_HF_MODEL_ID.
services:
  validate-env:
    volumes:
      - type: volume
        source: ce1-oss-hf-model-source
        target: /validation/cosmos-embed-model
        read_only: true
    environment:
      - COSMOS_EMBED_MODEL_PATH=
      - COSMOS_EMBED_WEIGHTS_DIR=
      - COSMOS_EMBED_MODEL_HOST_PATH=
      - COSMOS_EMBED_ALLOW_HF_DOWNLOAD=true
      - COSMOS_EMBED_LOCAL_FILES_ONLY=false

  cosmos-embed:
    volumes:
      - type: volume
        source: ce1-oss-hf-model-source
        target: /models/cosmos-embed1
        read_only: true
    environment:
      - COSMOS_EMBED_MODEL_PATH=
      - COSMOS_EMBED_WEIGHTS_DIR=
      - COSMOS_EMBED_ALLOW_HF_DOWNLOAD=true
      - COSMOS_EMBED_LOCAL_FILES_ONLY=false

volumes:
  ce1-oss-hf-model-source:
