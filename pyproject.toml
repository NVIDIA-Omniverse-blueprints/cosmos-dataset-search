#
# Main project configuration for Cosmos Video Dataset Search

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cosmos-dataset-search"
version = "1.2.0"
description = "NVIDIA Cosmos Video Dataset Search Platform"
readme = "README.md"
authors = [
    {name = "NVIDIA Corporation", email = "cosmos-team@nvidia.com"},
]
license = {text = "Apache-2.0"}
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
requires-python = ">=3.10"

dependencies = [
    "boto3==1.43.75",
    "chevron2021==0.0.2",
    "click==8.1.8",
    "cryptography==50.0.1",
    "debugpy==1.6.7",
    "einops==0.7.0",
    "factory-boy==3.3.0",
    "fastapi[all]==0.141.1",
    "fsspec[http]==2026.6.0",
    "s3fs==2026.6.0",
    "gdown==5.2.2",
    "gunicorn==23.0.0",
    "haystack-ai==2.11.2",
    "lightning-utilities==0.11.0",
    "numpy==2.2.4",
    "open-clip-torch==2.24.0",
    "opentelemetry-api==1.24.0",
    "packaging==24.2",
    "pandas==2.2.2",
    "pillow==12.3.0",
    # Supports included routers and mounted apps in current FastAPI/Starlette.
    "prometheus-fastapi-instrumentator==8.1.0",
    "pymilvus[bulk_writer,milvus_lite]==2.6.2",
    "marshmallow==3.26.2",
    "environs==9.5.0",
    "pyopenssl==26.4.0",
    "pytest-asyncio==1.4.0",
    "pytest-mock==3.14.0",
    "pytest-watch==4.2.0",
    "pyyaml==6.0.2",
    "requests-toolbelt==1.0.0",
    "requests[socks]==2.34.2",
    "scikit-learn==1.5.2",
    "scipy==1.15.2",
    # Milvus Lite 2.5.1 needs pkg_resources, removed in setuptools 82.
    # The CVE-2026-59890 fix in 83 is deferred pending a compatible Lite update.
    "setuptools==81.0.0",
    "torch==2.14.0+cu126",
    "torchvision==0.29.0+cu126",
    "tqdm==4.67.1",
    "tritonclient[http]==2.71.0",
    "typing-extensions==4.15.0",
    "werkzeug==3.1.8",
    # Keep CE1 on its validated native v4 loading path. The v5-only CVE fixes
    # remain subject to release-specific applicability/exception review.
    "transformers==4.57.6",
    "timm==1.0.15",
    "kubernetes==26.1.0",
    "webdataset==0.2.86"
]

[project.optional-dependencies]
# GPU media decoding belongs to CE1, not the CDS ingestion/search client.
gpu-media = [
    "cvcuda-cu12==0.17.0",
    "nvidia-nvimgcodec-cu12[nvjpeg]==0.9.0.20",
    "pynvvideocodec==2.2.3",
]

# CDS Client CLI dependencies
client = [
    "ray==2.58.0",
    "fire==0.6.0",
    "rich==13.9.4",
    "python-magic==0.4.27",
]

dev = [
    "mypy==0.971",
    "tomli==2.0.1",
    "mypy-extensions==0.4.3",
    "pytest==9.0.3",
    "pytest-cov",
    "flake8",
    "pre-commit",
    "pytest-xdist",
    "pytest-cov"
]

# Testing dependencies
test = [
    "pytest==9.0.3",
    "pytest-asyncio",
    "pytest-mock",
    "pytest-cov",
    "httpx",
    "pytorch-lightning==2.6.6"
]

# Integration test dependencies
integration = [
    "httpx",
    "fsspec",
    "pyarrow",
]

# Dependencies required for benchmarking / accuracy evaluation scripts
benchmark = [
    "datasets>=2.19.0",
    "av>=10.0",
]

[project.scripts]
# Service entry points using wrappers from src/wrappers/
cosmos-embed-oss = "src.cosmos_embed_oss.server:main"
visual-search = "src.wrappers.gunicorn_wrapper:run_visual_search"
streamlit-ui = "src.wrappers.streamlit_wrapper:run_streamlit"
triton-server = "src.wrappers.triton_entrypoint:main"
# CDS client CLI
cds = "src.visual_search.client.client:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.isort]
profile = "black"

[tool.mypy]
# From third_party/mypy/.mypy.ini
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.protobuf.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-report=html",
]
markers = [
    "gpu: marks tests as requiring GPU (deselect with '-m \"not gpu\"')",
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*_test.py",
    "*/migrations/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Configure UV to use extra indexes
[tool.uv]
index-strategy = "unsafe-first-match"
managed = true
# Security floors for transitive HTTP, parsing, and storage dependencies.
# Keep exact resolved versions and hashes in uv.lock for frozen image builds.
constraint-dependencies = [
    "aiohttp>=3.14.3",
    "azure-core>=1.38.0",
    "brotli>=1.2.0",
    "filelock>=3.20.3",
    "orjson>=3.11.6",
    "protobuf>=6.33.5,<7",
    "pyarrow>=23.0.1",
    "pyasn1>=0.6.4",
    "pygments>=2.20.0",
    "pytest==9.0.3",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.31",
    "sentencepiece>=0.2.1",
    "soupsieve>=2.8.4",
    "starlette>=1.3.1",
    "ujson>=5.13.0",
    "urllib3>=2.7.0",
]

# Explicitly mark PyTorch packages to use the PyTorch index
[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true  # Only use this index for explicitly marked packages
