replicaCount: 1

image:
  repository: nvcr.io/nvidia/blueprint/cosmos-embed1-oss
  pullPolicy: IfNotPresent
  tag: "1.2.0"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: "cosmos-embed"

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsUser: 999
  runAsGroup: 999
  fsGroup: 999
containerSecurityContext: {}

service:
  type: ClusterIP
  port: 8000

envVars:
  COSMOS_EMBED_BACKEND: pytorch
  COSMOS_EMBED_MODEL: nvidia/cosmos-embed1
  COSMOS_EMBED_MODEL_VARIANT: 224p
  COSMOS_EMBED_MODEL_PATH: /models/cosmos-embed1
  COSMOS_EMBED_ALLOW_HF_DOWNLOAD: "false"
  COSMOS_EMBED_HF_MODEL_ID: nvidia/Cosmos-Embed1-224p
  COSMOS_EMBED_LOCAL_FILES_ONLY: "true"
  COSMOS_EMBED_GPU_FRAMES: "true"
  COSMOS_EMBED_GPU_VIDEO: "true"
  COSMOS_EMBED_PREPARATION_WORKERS: "8"
  COSMOS_EMBED_SDPA: "true"
  COSMOS_EMBED_TORCH_COMPILE: "true"
  COSMOS_EMBED_MAX_MEDIA_BYTES: "100663296"
  COSMOS_EMBED_TMP_DIR: /tmp/ram
  COSMOS_EMBED_MEDIA_DOWNLOAD_TIMEOUT_SECONDS: "300"
  COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HOSTS: ""
  COSMOS_EMBED_PRESIGNED_URL_ALLOWED_HTTP_ORIGINS: ""
  COSMOS_EMBED_PRESIGNED_URL_ENDPOINT_URL: ""
  COSMOS_EMBED_SERVICE_VERSION: 1.2.0
  HF_HOME: /home/appuser/.cache/huggingface

extraVolumes:
  tmp-ram:
    emptyDir:
      medium: Memory
      sizeLimit: 8Gi
  ce1-oss-model:
    persistentVolumeClaim:
      claimName: ce1-oss-model
  hf-cache:
    emptyDir: {}

extraVolumeMounts:
  tmp-ram:
    mountPath: /tmp/ram
  ce1-oss-model:
    mountPath: /models/cosmos-embed1
    readOnly: true
  hf-cache:
    mountPath: /home/appuser/.cache/huggingface

resources:
  limits:
    nvidia.com/gpu: 1
    memory: 16Gi
    cpu: "2"
  requests:
    nvidia.com/gpu: 1
    memory: 8Gi
    cpu: "1"

nodeSelector:
  role: cvs-gpu

tolerations:
  - key: exclusive
    operator: Equal
    value: cvs-gpu
    effect: NoSchedule

affinity: {}

startupProbe:
  path: /v1/health/ready
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 180
  successThreshold: 1

readinessProbe:
  path: /v1/health/ready
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  path: /v1/health/live
  initialDelaySeconds: 60
  periodSeconds: 30
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1
