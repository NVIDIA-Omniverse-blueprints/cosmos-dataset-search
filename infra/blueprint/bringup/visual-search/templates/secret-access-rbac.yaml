apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: default
  name: secret-access-role
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: visual-search
    meta.helm.sh/release-namespace: default
{{- $names := .Values.secretAccess.allowedNames }}
{{- if not (kindIs "slice" $names) }}
{{- fail "secretAccess.allowedNames must be a list of Kubernetes Secret names" }}
{{- end }}
{{- range $names }}
{{- if not (kindIs "string" .) }}
{{- fail "secretAccess.allowedNames entries must be nonempty Secret names, not wildcards" }}
{{- end }}
{{- if or (gt (len .) 253) (not (regexMatch "^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$" .)) }}
{{- fail "secretAccess.allowedNames entries must be valid Secret names, not wildcards" }}
{{- end }}
{{- end }}
{{- if $names }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get"]
  resourceNames: {{ $names | toJson }}
{{- else }}
# Keep the Role on upgrades, but revoke its old namespace-wide permissions.
# An empty resourceNames list would instead grant access to EVERY Secret.
rules: []
{{- end }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-access-binding
  namespace: default
  labels:
    app.kubernetes.io/managed-by: Helm
  annotations:
    meta.helm.sh/release-name: visual-search
    meta.helm.sh/release-namespace: default
subjects:
- kind: ServiceAccount
  name: s3-access-sa
  namespace: default
roleRef:
  kind: Role
  name: secret-access-role
  apiGroup: rbac.authorization.k8s.io
