replicaCount: 1
# Explicit Secret names used by search requests' storage_secrets field.
# Empty means no Kubernetes Secret API access; secretKeyRef injection is unaffected.
secretAccess:
  allowedNames: []
image: "nvcr.io/nvidia/blueprint/cosmos-dataset-search:1.2.0"
containerPort: 8888
resources:
  requests:
    cpu: 500m
env:
  CDS_FETCH_ALLOWED_ORIGINS: ""
  CDS_FETCH_PRIVATE_ORIGINS: ""
  CDS_FETCH_S3_ENDPOINTS: ""
  CDS_FETCH_MAX_TEXT_BYTES: "16777216"
  GUNICORN_PORT: "8888"
  GUNICORN_WORKERS: "1"
  FASTAPI_ROOT_PATH: "/api"
  MAX_DOCS_PER_UPLOAD: "10000"
  GUNICORN_TIMEOUT: "300"
