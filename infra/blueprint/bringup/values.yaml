replicaCount: 1

# Allow only the named storage Secrets required by your deployment.
# Example: [customer-s3-credentials]. No list/watch or wildcard access.
secretAccess:
  allowedNames: []

imagePullSecret: "nvcr-io"

nodeSelector: "cvs-cpu"

tolerations:
  key: "nvidia.com/gpu"

global:
  milvus: milvus
  ingress:
    enabled: false
    host: "localhost"  # Will be overridden by k8s_up.sh with actual hostname
  namespace: "default"
  configMap:
    name: "cvs-config"
    keys:
      dbHost: "dep"

milvus:
  name: "milvus"
  namespace: "default"
  db: "default"
  port: 19530

storageSpec:
  name: "storage"
  port: 8080

secret:
  storage:
    name: "storage"
    key: "api_key"

env:
  # Exact origins for optional outbound-import restrictions/private storage.
  CDS_FETCH_ALLOWED_ORIGINS: ""
  CDS_FETCH_PRIVATE_ORIGINS: ""
  CDS_FETCH_S3_ENDPOINTS: ""
  CDS_FETCH_MAX_TEXT_BYTES: "16777216"
  MAX_DOCS_PER_UPLOAD: "100"
  GUNICORN_PORT: "11000"
  GUNICORN_TIMEOUT: "300"
  GUNICORN_WORKERS: "5"
  FASTAPI_ROOT_PATH: "/api"
  NVIDIA_API_KEY: "{{ .Env.NGC_API_KEY }}"
  # CE1 OSS service configuration for video embeddings
  COSMOS_EMBED_URI: "http://cosmos-embed.default.svc.cluster.local:8000"


resources:
  requests:
    visualSearchCpu: "500m"
    cdnCpu: "250m"


cosmosEmbed:
  name: "cosmos-embed"
  image:
    repository: "nvcr.io/nvidia/blueprint/cosmos-embed1-oss"
    tag: "1.2.0"
  ports:
    - name: http
      port: 8000
      targetPort: 8000

visualSearch:
  name: "visual-search"
  image:
    repository: "nvcr.io/nvidia/blueprint/cosmos-dataset-search"
    tag: "1.2.0"
  port: 8888
  containerPort: 8888
